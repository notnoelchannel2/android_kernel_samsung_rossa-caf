name: CyanogenMod Kernel CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v7

    - name: Getting Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install lib32z1
        sudo git clone --depth 1 --branch android-4.4.4_r2.0.1 --single-branch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.7 /opt/toolchains/arm-eabi-4.7/
    - name: Building Kernel
      run: |
        export ARCH=arm
        export CROSS_COMPILE=/opt/toolchains/arm-eabi-4.7/bin/arm-eabi-
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped
        make -j2 msm8916_sec_defconfig VARIANT_DEFCONFIG=msm8916_sec_rossa_eur_defconfig SELINUX_DEFCONFIG=selinux_defconfig
        make -j$(nproc --all)
    - name: Moving Output # CI only
      run: |
        mkdir -p /home/runner/work/output
        cp arch/arm/boot/zImage /home/runner/work/output/zImage
        chmod +x tools/dtbTool  # only needed if it isn't executable
        ./tools/dtbTool -s 2048 -o /home/runner/work/output/dt.img -p scripts/dtc/ arch/arm/boot/
        find . -name "*.ko" -exec cp {} /home/runner/work/output/ \;
    - name: Uploading zImage
      uses: actions/upload-artifact@v6
      with:
        name: zImage
        path: /home/runner/work/output/zImage

    - name: Uploading dt.img
      uses: actions/upload-artifact@v6
      with:
        name: dt.img
        path: /home/runner/work/output/dt.img
        
    - name: Uploading Modules
      uses: actions/upload-artifact@v6
      with:
        name: modules
        path: /home/runner/work/output/*.ko
